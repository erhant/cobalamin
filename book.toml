[book]
title = "cobalamin"
authors = ["erhant"]
language = "en"
src = "contents"

# uses KaTeX instead of MathJax, much better interop
[preprocessor.katex]
after = ["links"]

# converts mermaid drawings to SVG
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/cobalamin/"
additional-css = ["./vendor/mermaid-center.css", "./vendor/sigils.css"]
additional-js = ["./vendor/mermaid.min.js", "./vendor/mermaid-init.js"]
git-repository-url = "https://github.com/erhant/cobalamin"
default-theme = "light"
# sigils already mark each page, so drop the "1.2." chapter numbers
no-section-label = true
